# ===== B1-2 GitHub Pages 자동 빌드·배포 시작 =====
name: Deploy B1-2 homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: b1-2-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run verify
      - run: npm test
      # ===== 2. Supabase 연결값을 Vite 빌드에 전달 시작 =====
      - name: Build React app with Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      # ===== 2. Supabase 연결값을 Vite 빌드에 전달 끝 =====
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
# ===== B1-2 GitHub Pages 자동 빌드·배포 끝 =====
